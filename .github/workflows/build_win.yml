name: Build-win-exe

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: develop

    # =========================
    # 1. 正确读取 VERSION（PowerShell）
    # =========================
    - name: Read version
      shell: pwsh
      run: |
        $version = Get-Content VERSION -TotalCount 1
        "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
        Write-Host "Build version: $version"

    - name: Generate timestamp
      shell: pwsh
      run: |
        $ts = Get-Date -Format "yyyyMMdd"
        "TS=$ts" | Out-File -FilePath $env:GITHUB_ENV -Append
    

    # =========================
    # 2. 安装 MSYS2 + 依赖
    # =========================
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-meson
          mingw-w64-x86_64-ninja
          mingw-w64-x86_64-pkg-config
          mingw-w64-x86_64-python-sphinx
          mingw-w64-x86_64-cmocka
          mingw-w64-x86_64-libusb
          mingw-w64-x86_64-libftdi

    # =========================
    # 3. Meson 配置
    # =========================
    - name: Configure Meson
      shell: msys2 {0}
      run: |
        meson setup builddir \
          -Dprogrammer=ch347_spi \
          -Drpmc=disabled \
          -Dc_args="-U HAVE_CLOCK_GETTIME -DHAVE_CLOCK_GETTIME=0 -Wno-error=builtin-macro-redefined"

    # =========================
    # 4. 编译
    # =========================
    - name: Build
      shell: msys2 {0}
      run: meson compile -C builddir

    # Keep the original static CLI build above unchanged. This second build
    # links the same CLI sources against libflashrom.dll.
    - name: Configure shared CLI
      shell: msys2 {0}
      run: |
        meson setup builddir-shared \
          -Dprogrammer=ch347_spi \
          -Drpmc=disabled \
          -Ddefault_library=shared \
          -Dcli_link_mode=shared \
          -Dc_args="-U HAVE_CLOCK_GETTIME -DHAVE_CLOCK_GETTIME=0 -Wno-error=builtin-macro-redefined"

    - name: Build shared CLI
      shell: msys2 {0}
      run: meson compile -C builddir-shared

    - name: Package shared CLI
      shell: msys2 {0}
      run: |
        set -euo pipefail
        package="builddir-shared/flashrom-win-x64-shared-${VERSION}"
        mkdir -p "$package"
        cp builddir-shared/flashrom.exe "$package/flashrom.exe"
        cp include/libflashrom.h "$package/"
        cp SHARED_CLI.md "$package/"
        mapfile -t dlls < <(find builddir-shared -maxdepth 1 -type f -name '*.dll')
        test "${#dlls[@]}" -eq 1
        cp "${dlls[0]}" "$package/"
        dll_name="$(basename "${dlls[0]}")"
        objdump -p builddir-shared/flashrom.exe | grep -Fi "DLL Name: $dll_name"
        objdump -p "${dlls[0]}" | grep -F 'flashrom_init'
        objdump -p "${dlls[0]}" | grep -F 'flashrom_image_read'
        # Follow imports recursively so the package runs without MSYS2 in PATH.
        queue=("$package/flashrom.exe" "$package/$dll_name")
        for ((i=0; i<${#queue[@]}; i++)); do
          while read -r import; do
            runtime="$(find /mingw64/bin -maxdepth 1 -type f -iname "$import" -print -quit)"
            if test -n "$runtime" && ! test -f "$package/$(basename "$runtime")"; then
              cp "$runtime" "$package/"
              queue+=("$package/$(basename "$runtime")")
            fi
          done < <(objdump -p "${queue[i]}" | awk '/DLL Name:/ {print $3}')
        done

    - name: Compile documented MSVC C and C++ clients
      shell: pwsh
      run: |
        $doc = Get-Content SHARED_CLI.md -Raw
        $match = [regex]::Match($doc, '(?s)```c\r?\n(.*?)\r?\n```')
        if (-not $match.Success) { throw "C example was not found in SHARED_CLI.md" }
        Set-Content -LiteralPath builddir-shared/flashrom_read.c -Value $match.Groups[1].Value -Encoding utf8
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vs = (& $vswhere -latest -property installationPath).Trim()
        if (-not $vs) { throw "Visual Studio was not found" }
        $dev = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
        cmd /c "`"$dev`" -arch=x64 && cl /nologo /W4 /std:c11 /TC /Iinclude /Fobuilddir-shared\read_c.obj /Febuilddir-shared\read_c.exe builddir-shared\flashrom_read.c && cl /nologo /W4 /EHsc /std:c++17 /TP /Iinclude /Fobuilddir-shared\read_cpp.obj /Febuilddir-shared\read_cpp.exe builddir-shared\flashrom_read.c"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Verify shared CLI package
      shell: pwsh
      run: |
        $package = "builddir-shared/flashrom-win-x64-shared-$env:VERSION"
        $bin = (Resolve-Path $package).Path
        $oldPath = $env:PATH
        try {
          $env:PATH = "$bin;$env:SystemRoot\System32;$env:SystemRoot"
          & (Join-Path $bin 'flashrom.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        } finally {
          $env:PATH = $oldPath
        }
        Compress-Archive -Path "$package/*" -DestinationPath "$package.zip" -Force
        $unpacked = "builddir-shared/verify-shared-$env:VERSION"
        Expand-Archive -Path "$package.zip" -DestinationPath $unpacked -Force
        & (Join-Path (Resolve-Path $unpacked).Path 'flashrom.exe') --version
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # =========================
    # 5. 正确重命名 exe（PowerShell）
    # =========================
    - name: Rename binary
      shell: pwsh
      run: |
        Rename-Item `
          builddir/flashrom.exe `
          ("flashrom-win-x64-{0}.exe" -f $env:VERSION)

    # =========================
    # 6. 上传 Artifact（Actions 内部使用）
    # =========================
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: flashrom-win-x64-${{ env.VERSION }}
        path: builddir/flashrom-win-x64-${{ env.VERSION }}.exe

    - name: Upload shared CLI artifact
      uses: actions/upload-artifact@v4
      with:
        name: flashrom-win-x64-shared-${{ env.VERSION }}
        path: builddir-shared/flashrom-win-x64-shared-${{ env.VERSION }}.zip


    - name: Package release archives
      shell: pwsh
      run: |
        Compress-Archive `
          -Path builddir/flashrom-win-x64-${env:VERSION}.exe `
          -DestinationPath builddir/flashrom-win-x64-${env:VERSION}.zip `
          -Force

    # =========================
    # 7. 发布到 GitHub Release
    #    ⚠️ 建议只在 develop 或 main 之一
    # =========================
    - name: Create GitHub Release (Windows)
      if: github.ref == 'refs/heads/develop'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.VERSION }}-${{ env.TS }}
        target_commitish: develop
        name:  ${{ env.VERSION }}-${{ env.TS }}
        files: |
          builddir/flashrom-win-x64-${{ env.VERSION }}.zip
          builddir-shared/flashrom-win-x64-shared-${{ env.VERSION }}.zip
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
