name: Build flashrom artifacts

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Read version
        shell: pwsh
        run: |
          $version = Get-Content VERSION -TotalCount 1
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libusb

      - name: Report build environment
        shell: msys2 {0}
        run: |
          set -euo pipefail
          test "$MSYSTEM" = UCRT64
          gcc --version
          meson --version
          ninja --version
          pkg-config --modversion libusb-1.0

      - name: Configure original CLI
        shell: msys2 {0}
        run: |
          set -euo pipefail
          meson setup builddir \
            -Dprogrammer=ch347_spi \
            -Drpmc=disabled \
            -Ddefault_library=static \
            -Dtests=disabled -Ddocumentation=disabled -Dman-pages=disabled

      - name: Build original CLI
        shell: msys2 {0}
        run: meson compile -C builddir

      - name: Configure shared CLI
        shell: msys2 {0}
        run: |
          set -euo pipefail
          meson setup builddir-shared \
            -Dprogrammer=ch347_spi \
            -Drpmc=disabled \
            -Ddefault_library=shared \
            -Dcli_link_mode=shared \
            -Dtests=disabled -Ddocumentation=disabled -Dman-pages=disabled

      - name: Build shared CLI
        shell: msys2 {0}
        run: meson compile -C builddir-shared

      - name: Stage Windows packages and collect runtime DLLs
        shell: msys2 {0}
        run: |
          set -euo pipefail
          package="builddir-shared/flashrom-win-x64-shared-${VERSION}"
          mkdir -p "$package"
          cp builddir-shared/flashrom.exe "$package/flashrom.exe"
          cp include/libflashrom.h SHARED_CLI.md "$package/"
          mapfile -t dlls < <(find builddir-shared -maxdepth 1 -type f -name '*.dll')
          test "${#dlls[@]}" -eq 1
          cp "${dlls[0]}" "$package/"
          dll_name="$(basename "${dlls[0]}")"
          objdump -p builddir-shared/flashrom.exe | grep -Fi "DLL Name: $dll_name"
          objdump -p "${dlls[0]}" | grep -F 'flashrom_init'
          objdump -p "${dlls[0]}" | grep -F 'flashrom_image_read'

          original="builddir/flashrom-win-x64-${VERSION}"
          mkdir -p "$original"
          cp builddir/flashrom.exe "builddir/flashrom-win-x64-${VERSION}.exe"
          cp builddir/flashrom.exe "$original/flashrom-win-x64-${VERSION}.exe"
          cp SHARED_CLI.md "$original/"
          original_imports="$(objdump -p builddir/flashrom.exe)"
          if grep -Fi 'DLL Name: libflashrom' <<< "$original_imports"; then
            echo 'Original CLI must link libflashrom statically' >&2
            exit 1
          fi

          # Resolve the complete non-system import closure for both packages.
          system_dir="$(cygpath -u "$SYSTEMROOT")/System32"
          for package in "$original" "$package"; do
            mapfile -t queue < <(find "$package" -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dll' \))
            for ((i=0; i<${#queue[@]}; i++)); do
              objdump -f "${queue[i]}" | grep -F 'file format pei-x86-64'
              imports="$(objdump -p "${queue[i]}")"
              while read -r import; do
                test -n "$import" || continue
                test ! -f "$package/$import" || continue
                runtime="$(find "$MINGW_PREFIX/bin" -maxdepth 1 -type f -iname "$import" -print -quit)"
                if test -n "$runtime"; then
                  cp "$runtime" "$package/"
                  queue+=("$package/$(basename "$runtime")")
                elif ! test -f "$system_dir/$import"; then
                  case "${import,,}" in
                    api-ms-win-*|ext-ms-win-*) ;;
                    *) echo "Unresolved DLL: $import (${queue[i]})" >&2; exit 1 ;;
                  esac
                fi
              done < <(awk '/DLL Name:/ {sub(/\r$/, ""); print $3}' <<< "$imports")
            done
          done

      - name: Compile documented MSVC C and C++ clients
        shell: pwsh
        run: |
          $doc = Get-Content SHARED_CLI.md -Raw
          $match = [regex]::Match($doc, '(?s)```c\r?\n(.*?)\r?\n```')
          if (-not $match.Success) { throw 'C example was not found in SHARED_CLI.md' }
          Set-Content -LiteralPath builddir-shared/flashrom_read.c -Value $match.Groups[1].Value -Encoding utf8
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = (& $vswhere -latest -property installationPath).Trim()
          if (-not $vs) { throw 'Visual Studio was not found' }
          $dev = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          cmd /c "`"$dev`" -arch=x64 && cl /nologo /W4 /std:c11 /TC /Iinclude /Fobuilddir-shared\read_c.obj /Febuilddir-shared\read_c.exe builddir-shared\flashrom_read.c && cl /nologo /W4 /EHsc /std:c++17 /TP /Iinclude /Fobuilddir-shared\read_cpp.obj /Febuilddir-shared\read_cpp.exe builddir-shared\flashrom_read.c"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package and verify Windows archives in an isolated environment
        shell: pwsh
        run: |
          $python = (Get-Command python -ErrorAction Stop).Source
          $verify = (Resolve-Path .github/scripts/verify-release.py).Path
          $packages = @(
            @{ Path = "builddir/flashrom-win-x64-$env:VERSION"; Exe = "flashrom-win-x64-$env:VERSION.exe" },
            @{ Path = "builddir-shared/flashrom-win-x64-shared-$env:VERSION"; Exe = 'flashrom.exe' }
          )
          $oldPath = $env:PATH
          try {
            foreach ($package in $packages) {
              $source = (Resolve-Path $package.Path).Path
              Compress-Archive -Path "$source/*" -DestinationPath "$source.zip" -Force
              $unpacked = Join-Path $env:RUNNER_TEMP (Split-Path $source -Leaf)
              Expand-Archive -Path "$source.zip" -DestinationPath $unpacked -Force
              $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
              Push-Location $env:RUNNER_TEMP
              try {
                & (Join-Path $unpacked $package.Exe) --version
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                if ($package.Exe -eq 'flashrom.exe') {
                  $dlls = @(Get-ChildItem -LiteralPath $unpacked -Filter '*flashrom*.dll')
                  if ($dlls.Count -ne 1) { throw 'Expected exactly one libflashrom DLL' }
                  & $python $verify library $dlls[0].FullName
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                }
              } finally {
                Pop-Location
              }
              $env:PATH = $oldPath
            }
          } finally {
            $env:PATH = $oldPath
          }

      - uses: actions/upload-artifact@v7.0.2
        with:
          archive: true
          name: flashrom-win-x64-${{ env.VERSION }}
          path: |
            builddir/flashrom-win-x64-${{ env.VERSION }}.exe
            builddir/flashrom-win-x64-${{ env.VERSION }}.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7.0.2
        with:
          archive: true
          name: flashrom-win-x64-shared-${{ env.VERSION }}
          path: builddir-shared/flashrom-win-x64-shared-${{ env.VERSION }}.zip
          if-no-files-found: error

      - name: Upload Windows build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          archive: true
          name: ci-logs-windows
          path: |
            builddir/meson-logs/
            builddir-shared/meson-logs/
          if-no-files-found: ignore

  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Read version
        run: |
          VERSION=$(head -n 1 VERSION)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install MacPorts
        run: |
          set -euxo pipefail
          curl -fL --retry 3 https://github.com/macports/macports-base/releases/download/v2.12.7/MacPorts-2.12.7-15-Sequoia.pkg -o MacPorts.pkg
          sudo installer -verbose -pkg MacPorts.pkg -target /
          /opt/local/bin/port version
          echo "/opt/local/bin" >> "$GITHUB_PATH"
          echo "/opt/local/sbin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=/opt/local/lib/pkgconfig:/opt/local/share/pkgconfig" >> "$GITHUB_ENV"

      - name: Install MacPorts packages
        run: |
          set -euxo pipefail
          sudo port -N selfupdate
          sudo port -N install meson ninja pkgconfig libusb
          test "$(uname -m)" = x86_64
          clang --version
          xcrun --show-sdk-version
          meson --version
          ninja --version
          pkg-config --modversion libusb-1.0

      - name: Configure original CLI
        run: |
          set -euxo pipefail
          meson setup builddir \
            -Dprogrammer=ch347_spi \
            -Drpmc=disabled \
            -Ddefault_library=static \
            -Dtests=disabled -Ddocumentation=disabled -Dman-pages=disabled

      - name: Build original CLI
        run: |
          set -euxo pipefail
          meson compile -C builddir

      - name: Configure shared CLI
        run: |
          set -euxo pipefail
          meson setup builddir-shared \
            -Dprogrammer=ch347_spi \
            -Drpmc=disabled \
            -Ddefault_library=shared \
            -Dcli_link_mode=shared \
            -Dtests=disabled -Ddocumentation=disabled -Dman-pages=disabled

      - name: Build shared CLI
        run: |
          set -euxo pipefail
          meson compile -C builddir-shared

      - name: Compile documented C and C++ clients
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          match = re.search(r'(?s)```c\r?\n(.*?)\r?\n```', Path('SHARED_CLI.md').read_text())
          if not match:
              raise SystemExit('C example was not found in SHARED_CLI.md')
          Path('builddir-shared/flashrom_read.c').write_text(match.group(1) + '\n')
          PY
          clang -std=c11 -Wall -Wextra -Iinclude builddir-shared/flashrom_read.c -o builddir-shared/read_c
          clang++ -std=c++17 -Wall -Wextra -x c++ -Iinclude builddir-shared/flashrom_read.c -o builddir-shared/read_cpp

      - name: Package and verify shared CLI
        run: |
          set -euo pipefail
          package="builddir-shared/flashrom-macos-intel-shared-${VERSION}"
          mkdir -p "$package"
          install -m 755 builddir-shared/flashrom "$package/flashrom"
          cp include/libflashrom.h SHARED_CLI.md "$package/"
          dylib=builddir-shared/libflashrom.1.dylib
          test -f "$dylib"
          cp -L "$dylib" "$package/libflashrom.1.dylib"
          install_name_tool -id '@rpath/libflashrom.1.dylib' "$package/libflashrom.1.dylib"
          old_ref="$(otool -L "$package/flashrom" | awk '/libflashrom/ {print $1; exit}')"
          test -n "$old_ref"
          install_name_tool -change "$old_ref" '@executable_path/libflashrom.1.dylib' "$package/flashrom"
          otool -L "$package/flashrom" | grep -F '@executable_path/libflashrom.1.dylib'
          nm -gU "$package/libflashrom.1.dylib" | grep -F '_flashrom_init'
          nm -gU "$package/libflashrom.1.dylib" | grep -F '_flashrom_image_read'
          python3 .github/scripts/verify-release.py macos "$package/flashrom" "$package/libflashrom.1.dylib"
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH "$package/flashrom" --version
          (cd "$package" && ditto -c -k --sequesterRsrc . "../flashrom-macos-intel-shared-${VERSION}.zip")
          mkdir -p builddir-shared/verify-shared
          ditto -x -k "${package}.zip" builddir-shared/verify-shared
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH builddir-shared/verify-shared/flashrom --version
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH python3 .github/scripts/verify-release.py library builddir-shared/verify-shared/libflashrom.1.dylib

      - name: Package and verify original CLI
        run: |
          set -euo pipefail
          package="builddir/flashrom-macos-intel-${VERSION}"
          mkdir -p "$package"
          install -m 755 builddir/flashrom "$package/flashrom-macos-intel-${VERSION}"
          cp SHARED_CLI.md "$package/"
          python3 .github/scripts/verify-release.py macos "$package/flashrom-macos-intel-${VERSION}"
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH "$package/flashrom-macos-intel-${VERSION}" --version
          (cd "$package" && ditto -c -k --sequesterRsrc . "../flashrom-macos-intel-${VERSION}.zip")
          mkdir -p verify/zip
          ditto -x -k "builddir/flashrom-macos-intel-${VERSION}.zip" verify/zip
          test -x "verify/zip/flashrom-macos-intel-${VERSION}"
          env -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH "verify/zip/flashrom-macos-intel-${VERSION}" --version

      - uses: actions/upload-artifact@v7.0.2
        with:
          archive: true
          name: flashrom-macos-intel-${{ env.VERSION }}
          path: builddir/flashrom-macos-intel-${{ env.VERSION }}.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v7.0.2
        with:
          archive: true
          name: flashrom-macos-intel-shared-${{ env.VERSION }}
          path: builddir-shared/flashrom-macos-intel-shared-${{ env.VERSION }}.zip
          if-no-files-found: error

      - name: Upload macOS build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          archive: true
          name: ci-logs-macos
          path: |
            builddir/meson-logs/
            builddir-shared/meson-logs/
          if-no-files-found: ignore

  publish-release:
    needs: [windows-x64, macos-intel]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: flashrom-*
          path: release-assets
          merge-multiple: true

      - name: Verify assets and calculate checksums
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version=$(head -n 1 VERSION)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          date_utc=$(date -u +%Y%m%d)
          tag="${version}-${date_utc}-g${GITHUB_SHA:0:12}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          assets=(
            "flashrom-win-x64-${version}.zip"
            "flashrom-win-x64-shared-${version}.zip"
            "flashrom-macos-intel-${version}.zip"
            "flashrom-macos-intel-shared-${version}.zip"
          )
          for asset in "${assets[@]}"; do
            test -s "release-assets/$asset"
          done
          python3 - "${assets[@]}" <<'PY'
          from pathlib import Path
          import sys
          import zipfile
          for name in sys.argv[1:]:
              with zipfile.ZipFile(Path('release-assets') / name) as archive:
                  if archive.testzip() is not None:
                      raise SystemExit(f'Corrupt ZIP: {name}')
                  if not any(entry.endswith('SHARED_CLI.md') for entry in archive.namelist()):
                      raise SystemExit(f'Missing runtime instructions: {name}')
          PY
          (cd release-assets && sha256sum "${assets[@]}" > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt

      - name: Publish one Release for both platforms
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release.outputs.tag }}
          fail_on_unmatched_files: true
          files: |
            release-assets/flashrom-win-x64-${{ env.VERSION }}.zip
            release-assets/flashrom-win-x64-shared-${{ env.VERSION }}.zip
            release-assets/flashrom-macos-intel-${{ env.VERSION }}.zip
            release-assets/flashrom-macos-intel-shared-${{ env.VERSION }}.zip
            release-assets/SHA256SUMS.txt
