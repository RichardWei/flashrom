name: Build-mac-intel

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: macos-15-intel

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Read version
        run: |
          set -e
          VERSION=$(head -n 1 VERSION)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Build version: $VERSION"

      - name: Generate timestamp
        run: |
          echo "TS=$(date +'%Y%m%d')" >> "$GITHUB_ENV"

      # ------------------------------------------------------------
      # MacPorts
      # ------------------------------------------------------------

      - name: Download MacPorts
        run: |
          set -euxo pipefail

          curl -fL \
            https://distfiles.macports.org/MacPorts/MacPorts-2.12.5-15-Sequoia.pkg \
            -o MacPorts.pkg

          ls -lh MacPorts.pkg

      - name: Install MacPorts
        run: |
          set -euxo pipefail

          sudo installer \
            -verbose \
            -pkg MacPorts.pkg \
            -target /

          /opt/local/bin/port version

          echo "/opt/local/bin" >> "$GITHUB_PATH"
          echo "/opt/local/sbin" >> "$GITHUB_PATH"

          echo "PKG_CONFIG_PATH=/opt/local/lib/pkgconfig:/opt/local/share/pkgconfig" >> "$GITHUB_ENV"

      - name: Update MacPorts
        run: |
          set -euxo pipefail

          sudo port -N selfupdate

      - name: Install MacPorts packages
        run: |
          set -euxo pipefail

          sudo port -N install \
            meson \
            ninja \
            pkgconfig \
            libusb \
            libftdi1 \
            cmocka \
            py313-sphinx

      # ------------------------------------------------------------
      # Verify dependencies
      # ------------------------------------------------------------

      - name: Verify dependencies
        run: |
          set -euxo pipefail

          echo "Architecture:"
          uname -m

          echo "macOS:"
          sw_vers

          echo "MacPorts:"
          port version

          echo "Tools:"
          which meson
          which ninja
          which pkg-config

          meson --version
          ninja --version
          pkg-config --version

          echo "libusb:"
          pkg-config --modversion libusb-1.0
          pkg-config --cflags --libs libusb-1.0

          echo "libftdi:"
          pkg-config --modversion libftdi1
          pkg-config --cflags --libs libftdi1

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Configure Meson
        run: |
          set -euxo pipefail

          meson setup builddir \
            -Dprogrammer=ch347_spi \
            -Drpmc=disabled \
            -Dc_args="-Wno-error=sometimes-uninitialized"

      - name: Build
        run: |
          set -euxo pipefail

          meson compile -C builddir

      # ------------------------------------------------------------
      # Check binary
      # ------------------------------------------------------------

      - name: Prepare binary
        run: |
          set -euxo pipefail

          install -m 755 \
            builddir/flashrom \
            builddir/flashrom-macos-intel-${VERSION}

          file builddir/flashrom-macos-intel-${VERSION}

          builddir/flashrom-macos-intel-${VERSION} --version

          echo "Linked libraries:"
          otool -L builddir/flashrom-macos-intel-${VERSION}

      # ------------------------------------------------------------
      # Package
      # ------------------------------------------------------------

      - name: Package archives
        run: |
          set -euxo pipefail

          cd builddir

          ditto -c -k --sequesterRsrc \
            flashrom-macos-intel-${VERSION} \
            flashrom-macos-intel-${VERSION}.zip

          tar czf \
            flashrom-macos-intel-${VERSION}.tar.gz \
            flashrom-macos-intel-${VERSION}

          shasum -a 256 \
            flashrom-macos-intel-${VERSION}.zip \
            flashrom-macos-intel-${VERSION}.tar.gz

      # ------------------------------------------------------------
      # Verify package
      # ------------------------------------------------------------

      - name: Verify archives
        run: |
          set -euxo pipefail

          rm -rf verify
          mkdir -p verify/zip verify/tar

          ditto -x -k \
            builddir/flashrom-macos-intel-${VERSION}.zip \
            verify/zip

          test -x verify/zip/flashrom-macos-intel-${VERSION}
          verify/zip/flashrom-macos-intel-${VERSION} --version

          tar xzf \
            builddir/flashrom-macos-intel-${VERSION}.tar.gz \
            -C verify/tar

          test -x verify/tar/flashrom-macos-intel-${VERSION}
          verify/tar/flashrom-macos-intel-${VERSION} --version

      # ------------------------------------------------------------
      # Upload
      # ------------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashrom-macos-intel-${{ env.VERSION }}
          path: |
            builddir/flashrom-macos-intel-${{ env.VERSION }}.zip
            builddir/flashrom-macos-intel-${{ env.VERSION }}.tar.gz

      # ------------------------------------------------------------
      # GitHub Release
      # ------------------------------------------------------------

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/develop'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}-${{ env.TS }}
          target_commitish: develop
          name: ${{ env.VERSION }}-${{ env.TS }}
          fail_on_unmatched_files: true
          files: |
            builddir/flashrom-macos-intel-${{ env.VERSION }}.zip
            builddir/flashrom-macos-intel-${{ env.VERSION }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

